<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarkanā Raķete</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { background-color: #ffffff; color: #222222; }
h1 { color: #df0d0d; }
.noteikumi { background-color: #eeeeee; padding: 12px; }
button { background-color: #245b91; color: #ffffff; border: 0; }

</style>
</head>
<body>
<header>
  <h1><b><i>Sarkanā Raķete</i></b></h1>
</header>
<main>
  <h2>Mērķis</h2>
  <ul>
    <li>Tikt līdz beigām</li>
  </ul>
  <h2>Noteikumi</h2>
  <ul>
    <li>Vadi Sarkano Raķeti</li>
    <li>Savāc visus kauliņus</li>
    <li>Izmanto WASD taustiņus lai vadītu raķeti</li>
  </ul>
</main>
</style>
<section id="sakums">
  <h2>Sākuma ekrāns</h2>
  <button onclick="paraditSpeli()">Sākt spēli</button>
</section>
<section id="laukums" hidden>
  <h2>Spēles ekrāns</h2>
  <p>Punkti: 0</p>
  <p>Šeit vēlāk būs spēlētājs.</p>
  <button onclick="paraditSakumu()">Atpakaļ</button>
</section>
<script>
// Gatavā palīdzība pogām. Šodien maini lapas tekstu un izvietojumu.
function paraditSpeli() {
  document.getElementById("sakums").hidden = true;
  document.getElementById("laukums").hidden = false;
}
function paraditSakumu() {
  document.getElementById("sakums").hidden = false;
  document.getElementById("laukums").hidden = true;
}
</script>
</footer>
</body>
</html>
