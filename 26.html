<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px 16px; margin: 6px 0; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* NOFORMĒ ŠEIT: pielieto 2.1. un 2.2. nodarbībā apgūto CSS */
body {
  background-color: #ffffff;
  color: #222222;
}

h1 {
  color: #222222;
}

.noteikumi {
  background-color: #f1f5f9;
  color: #222222;
  padding: 12px;
}

.laukums {
  width: 360px;
  padding: 12px;
  border: 2px solid #94a3b8;
  background-color: #f8fafc;
  box-sizing: border-box;
}

button {
  background-color: #245b91;
  color: #ffffff;
  border: 0;
}
</style>
</head>
<body>
<h1>Sarkanā Raķete</h1>
<p>Spēles mērķis ir iegūt pēc iespējas vairāk punktu, savācot kauliņus.</p>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>Savācot kauliņus, tu iegūsi punktus un dzirdēsi skaņas efektus.</p>
</section>
<div class="laukums">
  <h2>Spēles laukums</h2>
  <img src="Attēli/varonis.png" alt="Spēles varonis" width="128">
  <p>Kad savāc kauliņu.</p>
  <audio controls src="Skaņas/crunch.mp3"></audio>
  <p id="punkti">Punkti: 0</p>
  <button onclick="savakt()">Savākt punktu</button>
</div>
<script>
// Gatava punktu poga — šo skriptu nemaini.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
